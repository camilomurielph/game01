<script>
const W=400,H=225,WW=720,WH=480,cv=document.getElementById('c'),g=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),k=s>=2?Math.floor(s):s;cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- sprites (pixel art dibujado por código + contorno automático) ---------- */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 fn((a,b,cw,ch,col)=>{x.fillStyle=col;x.fillRect(a,b,cw,ch)});
 const d=x.getImageData(0,0,w,h),o=x.createImageData(w,h),A=(i,j)=>i>=0&&j>=0&&i<w&&j<h?d.data[(j*w+i)*4+3]:0;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const k=(j*w+i)*4;
  if(A(i,j))o.data.set(d.data.subarray(k,k+4),k);else if(A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1))o.data.set([20,16,28,255],k)}
 x.putImageData(o,0,0);return c}
const skin='#f1c27d';
function base(p,body,leg){p(4,12,2,3,leg);p(8,12,2,3,leg);p(4,7,6,5,body);p(3,7,1,4,skin);p(10,7,1,4,skin);p(4,2,6,5,skin);p(5,4,1,1,'#222');p(8,4,1,1,'#222')}
const SPR={
 guerrero:mk(14,16,p=>{base(p,'#4a6fa5','#3a3a4a');p(4,10,6,1,'#8a5a2b');p(4,1,6,3,'#aab');p(6,0,2,1,'#d33');p(11,3,1,7,'#dde');p(10,10,3,1,'#8a5a2b')}),
 hechicero:mk(14,16,p=>{base(p,'#6a3fa0','#6a3fa0');p(4,12,6,3,'#6a3fa0');p(3,1,8,2,'#4b2a7a');p(5,0,4,1,'#4b2a7a');p(11,3,1,10,'#7a4a1e');p(10,1,3,2,'#5ef')}),
 asesino:mk(14,16,p=>{base(p,'#2b2b38','#222');p(4,1,6,3,'#1c1c26');p(4,5,6,2,'#1c1c26');p(4,10,6,1,'#a33');p(11,8,1,3,'#cde')}),
 barbaro:mk(14,16,p=>{base(p,skin,'#7a4a1e');p(3,1,8,3,'#a0521d');p(4,6,6,2,'#a0521d');p(4,10,6,1,'#5a3a1a');p(11,5,1,7,'#7a4a1e');p(10,3,3,3,'#bcc')})};
const ES={

 bat:{sp:60,hp:6,dmg:4,r:5,c:'#a4a',s:mk(14,8,p=>{p(0,1,5,3,'#a4a');p(9,1,5,3,'#a4a');p(5,1,4,5,'#636');p(5,0,1,1,'#636');p(8,0,1,1,'#636');p(5,3,1,1,'#f33');p(8,3,1,1,'#f33')})},
 brute:{sp:22,hp:60,dmg:12,r:9,c:'#c66',s:mk(18,18,p=>{p(3,2,12,6,'#a55');p(2,8,14,8,'#733');p(0,8,3,6,'#a55');p(15,8,3,6,'#a55');p(6,4,2,2,'#ff0');p(10,4,2,2,'#ff0');p(2,0,2,3,'#eee');p(14,0,2,3,'#eee');p(4,16,4,2,'#422');p(10,16,4,2,'#422')})}};
/* ---------- clases ---------- */
const CLS={

 hechicero:{n:'Hechicero',hp:70,sp:64,atk:'p',r:150,cd:.55,dmg:10,kb:0,c:'#7cf',sk:'Nova',skcd:8,d:['Fragil.','Magia a distancia.']},
 asesino:{n:'Asesino',hp:85,sp:98,atk:'m',r:22,cd:.28,dmg:6,kb:20,c:'#e55',sk:'Sombra',skcd:3,d:['Muy rapido.','Golpes veloces.']},
 barbaro:{n:'Barbaro',hp:160,sp:60,atk:'m',r:36,cd:1,dmg:20,kb:110,c:'#fa4',sk:'Furia',skcd:12,d:['Resistente.','Hachazos brutales.']}};

 ['Vitalidad','+25 vida max. y cura',()=>{P.mhp+=25;P.hp=P.mhp}],['Alcance','+15% alcance',()=>P.r*=1.15],['Regeneracion','+1 vida por seg.',()=>P.regen+=1],['Descanso','Cura 50% de vida',()=>P.hp=Math.min(P.mhp,P.hp+P.mhp/2)]];
/* ---------- estado ---------- */
let S='menu',P,E=[],PR=[],PT=[],FX=[],R=0,left=0,spawnT=0,kills=0,best=0,cx=0,cy=0,time=0,banner=0,sh=0,ups=[],cls,J=null;

const K={};
function start(k){cls=k;const c=CLS[k];P={x:WW/2,y:WH/2,hp:c.hp,mhp:c.hp,sp:c.sp,dmg:c.dmg,cd:c.cd,r:c.r,t:0,inv:0,sk:0,face:1,rage:0,dash:0,dx:1,dy:0,shield:0,regen:0};
 E=[];PR=[];PT=[];FX=[];kills=0;R=0;nextRound()}
function nextRound(){R++;left=5+R*3+Math.floor(R*R/6);spawnT=1;banner=2;S='play'}
function spawn(){let x,y,i=0;do{const s=Math.random()*4|0,u=Math.random();x=s<2?u*WW:s==2?0:WW;y=s>1?u*WH:s?WH:0;i++}while(Math.hypot(x-P.x,y-P.y)<140&&i<10);
 const r=Math.random();let t='slime';if(R>=2&&r<.35)t='bat';if(R>=4&&r>.85)t='brute';
 const d=ES[t],m=1+(R-1)*.12;E.push({x,y,t,hp:d.hp*m,sp:d.sp*(1+Math.min(R,20)*.01),dmg:d.dmg,r:d.r,kx:0,ky:0,fl:0,s:d.s,c:d.c})}
function burst(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=20+Math.random()*50;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.3+Math.random()*.2,c})}}
function dmgE(e,d,kx,ky){e.hp-=d;e.fl=.1;e.kx+=kx;e.ky+=ky;burst(e.x,e.y,2,'#fff')}
function near(rg){let b=null,bd=rg;for(const e of E){const d=Math.hypot(e.x-P.x,e.y-P.y)-e.r;if(d<bd){bd=d;b=e}}return b}
function attack(){const c=CLS[cls],t=near(P.r);if(!t)return 0;const m=(P.rage>0?2:1)*(P.bp>0?1.5:1)*(P.nd>0?.85:1);
 if(c.atk=='m'){for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<P.r+e.r)dmgE(e,P.dmg*m,dx/d*c.kb,dy/d*c.kb)}FX.push({x:P.x,y:P.y,r:P.r,t:.15,T:.15,c:c.c})}
 else{const dx=t.x-P.x,dy=t.y-P.y,d=Math.hypot(dx,dy)||1;PR.push({x:P.x,y:P.y-4,vx:dx/d*180,vy:dy/d*180,d:P.dmg*m,t:1.2,pi:2,h:[]})}
 return 1}
function special(){if(P.sk>0||S!='play')return;P.sk=CLS[cls].skcd;
 if(cls=='guerrero')P.shield=2.5;
 else if(cls=='hechicero'){FX.push({x:P.x,y:P.y,r:85,t:.35,T:.35,c:'#7cf'});for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<85+e.r)dmgE(e,40+P.dmg,dx/d*160,dy/d*160)}}
 else if(cls=='asesino'){P.dash=.18;P.inv=Math.max(P.inv,.4)}
 else P.rage=4}
function hurt(d){P.hp-=d;P.inv=.5;sh=.2;burst(P.x,P.y,8,'#f55');if(P.hp<=0){S='dead';if(R>best){best=R;try{localStorage.setItem('best',R)}catch(e){}}}}
/* ---------- actualizar ---------- */
function upd(dt){time+=dt;banner-=dt;sh-=dt;
 let ix=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),iy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);
 if(J){ix=J.x;iy=J.y}
 const m=Math.hypot(ix,iy);let mx=0,my=0;if(m>.1){mx=ix/m;my=iy/m;P.dx=mx;P.dy=my;if(mx)P.face=mx>0?1:-1}
 if(P.dash>0){P.dash-=dt;P.x+=P.dx*320*dt;P.y+=P.dy*320*dt}else{const sp=P.sp*(P.rage>0?1.3:1);P.x+=mx*sp*dt;P.y+=my*sp*dt}
 P.x=clamp(P.x,8,WW-8);P.y=clamp(P.y,10,WH-6);
 P.inv-=dt;P.sk-=dt;P.rage-=dt;P.shield-=dt;if(P.regen)P.hp=Math.min(P.mhp,P.hp+P.regen*dt);
 P.t-=dt;if(P.t<=0&&attack())P.t=P.cd/(P.rage>0?2:1);
 spawnT-=dt;if(left>0&&spawnT<=0&&E.length<180){const n=Math.min(left,1+(R>>2));for(let i=0;i<n;i++)spawn();left-=n;spawnT=Math.max(.12,.7-R*.04)}
 for(const e of E){const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  e.x+=(dx/d*e.sp+e.kx)*dt;e.y+=(dy/d*e.sp+e.ky)*dt;const f=Math.pow(.02,dt);e.kx*=f;e.ky*=f;e.fl-=dt;
  if(d<e.r+5&&P.inv<=0&&P.shield<=0&&S=='play')hurt(e.dmg)}
 for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){const a=E[i],b=E[j],dx=b.x-a.x,dy=b.y-a.y,rr=(a.r+b.r)*.8,d2=dx*dx+dy*dy;
  if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=(rr-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o}}
 for(const p of PR){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;
  for(const e of E)if(p.t>0&&!p.h.includes(e)&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+3){p.h.push(e);dmgE(e,p.d,p.vx*.3,p.vy*.3);if(--p.pi<=0)p.t=0}}
 PR=PR.filter(p=>p.t>0);
 const alive=[];for(const e of E){if(e.hp>0)alive.push(e);else{kills++;burst(e.x,e.y,8,e.c)}}E=alive;
 for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}PT=PT.filter(p=>p.t>0);
 for(const f of FX)f.t-=dt;FX=FX.filter(f=>f.t>0);
 if(S=='play'&&left<=0&&!E.length){S='up';P.hp=Math.min(P.mhp,P.hp+P.mhp*.15);ups=UP.slice().sort(()=>Math.random()-.5).slice(0,3)}}
/* ---------- dibujar ---------- */
function T(s,x,y,c='#fff',a='left',z=8){g.font='bold '+z+'px monospace';g.textAlign=a;g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=c;g.fillText(s,x,y)}
function spr(s,x,y,fl){x=Math.round(x-cx);y=Math.round(y-cy);if(fl){g.save();g.translate(x,0);g.scale(-1,1);g.drawImage(s,-s.width/2,y-s.height/2);g.restore()}else g.drawImage(s,x-s.width/2,y-s.height/2)}
function shadow(x,y,w){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(Math.round(x-cx-w/2),Math.round(y-cy+5),w,3)}
function drawP(){if(P.inv>0&&((time*20)|0)%2)return;shadow(P.x,P.y,10);spr(SPR[cls],P.x,P.y,P.face<0);
 if(P.shield>0||P.rage>0){g.strokeStyle=P.shield>0?'#7cf':'#f64';g.beginPath();g.arc(P.x-cx,P.y-cy,12,0,6.283);g.stroke()}}
function menu(){T('ELIGE TU CLASE',W/2,26,'#ffd24a','center',14);T('Sobrevive la mayor cantidad de rondas  -  Mejor: '+best,W/2,42,'#bbb','center');
 ORDER.forEach((k,i)=>{const c=CLS[k],x=8+i*98,y=52,s=SPR[k];g.fillStyle='#262338';g.fillRect(x,y,90,150);g.fillStyle=c.c;g.fillRect(x,y,90,2);
  g.drawImage(s,x+45-s.width*1.5,y+10,s.width*3,s.height*3);
  T((i+1)+'. '+c.n,x+45,y+76,'#fff','center',9);c.d.forEach((l,j)=>T(l,x+45,y+90+j*10,'#aaa','center',7));
  T('Vida '+c.hp+' Vel '+c.sp,x+45,y+118,'#8c8','center',7);T('Esp: '+c.sk,x+45,y+134,c.c,'center',8)});
 T('Mover: WASD / flechas / arrastrar   Especial: Espacio / boton',W/2,H-8,'#999','center',7)}
function drawOld(){g.save();g.fillStyle='#14121c';g.fillRect(0,0,W,H);
 if(S=='menu'){menu();g.restore();return}
 cx=clamp(P.x-W/2,0,WW-W);cy=clamp(P.y-H/2,0,WH-H);
 if(sh>0)g.translate((Math.random()-.5)*sh*20,(Math.random()-.5)*sh*20);
 for(let j=(cy/16)|0;j<=((cy+H)/16|0);j++)for(let i=(cx/16)|0;i<=((cx+W)/16|0);i++){if(i*16>=WW||j*16>=WH)continue;
  g.fillStyle=BIO.t[((i+j)&1)+(((i*73856093^j*19349663)>>>5)%5==0?1:0)];g.fillRect(i*16-Math.round(cx),j*16-Math.round(cy),16,16);
  if(((i*73856093^j*19349663)>>>0)%7==0){g.fillStyle=BIO.d;g.fillRect(i*16+5-Math.round(cx),j*16+7-Math.round(cy),1,2)}}
 drawProps();for(const f of FX){g.globalAlpha=f.t/f.T;g.strokeStyle=f.c;g.lineWidth=2;g.beginPath();g.arc(f.x-cx,f.y-cy,f.r*(.6+.4*(1-f.t/f.T)),0,6.283);g.stroke();g.lineWidth=1;g.globalAlpha=1}
 drawSorted();
 for(const p of PR){g.fillStyle='#5ef';g.fillRect(Math.round(p.x-cx-2),Math.round(p.y-cy-2),4,4);g.fillStyle='#fff';g.fillRect(Math.round(p.x-cx-1),Math.round(p.y-cy-1),2,2)}
 for(const p of PT){g.fillStyle=p.c;g.fillRect(Math.round(p.x-cx),Math.round(p.y-cy),2,2)}
 g.restore();
 g.fillStyle='#000';g.fillRect(5,5,66,8);g.fillStyle='#e33';g.fillRect(6,6,64*clamp(P.hp/P.mhp,0,1),6);T(Math.ceil(P.hp)+'/'+P.mhp,38,12,'#fff','center',7);
 T('Ronda '+R,W/2,12,'#ffd24a','center',9);T('Enemigos '+(left+E.length)+'  Bajas '+kills,W-5,12,'#fff','right',7);
 const bx=-99,by=-99,cd=clamp(P.sk/CLS[cls].skcd,0,1);g.fillStyle='#262338';g.beginPath();g.arc(bx,by,16,0,6.283);g.fill();
 if(cd>0){g.fillStyle='rgba(0,0,0,.6)';g.beginPath();g.moveTo(bx,by);g.arc(bx,by,16,-1.57,-1.57+6.283*cd);g.fill()}
 g.strokeStyle=cd>0?'#666':CLS[cls].c;g.lineWidth=2;g.beginPath();g.arc(bx,by,16,0,6.283);g.stroke();g.lineWidth=1;T(CLS[cls].sk,bx,by+3,'#fff','center',6);
 if(J){g.globalAlpha=.4;g.fillStyle='#fff';g.beginPath();g.arc(J.ox,J.oy,16,0,6.283);g.fill();g.beginPath();g.arc(J.kx,J.ky,7,0,6.283);g.fill();g.globalAlpha=1}
 if(banner>0&&S=='play'){g.globalAlpha=clamp(banner,0,1);T('RONDA '+R,W/2,80,'#fff','center',20);g.globalAlpha=1}
 if(S=='up'){g.fillStyle='rgba(10,8,18,.85)';g.fillRect(0,0,W,H);T('RONDA '+R+' SUPERADA',W/2,40,'#ffd24a','center',14);T('Elige una mejora (1-3 o toca)',W/2,56,'#bbb','center');
  ups.forEach((u,i)=>{const x=10+i*130,y=72;g.fillStyle='#262338';g.fillRect(x,y,120,90);g.fillStyle='#ffd24a';g.fillRect(x,y,120,2);T((i+1)+'. '+u[0],x+60,y+34,'#fff','center',9);T(u[1],x+60,y+54,'#9d9','center',7)})}
 if(S=='dead'){g.fillStyle='rgba(10,8,18,.85)';g.fillRect(0,0,W,H);T('HAS CAIDO',W/2,70,'#e55','center',20);T('Llegaste a la ronda '+R,W/2,100,'#fff','center',10);
  T('Bajas: '+kills+'   Mejor ronda: '+best,W/2,116,'#bbb','center',8);T('Toca o pulsa Enter para volver al menu',W/2,150,'#ffd24a','center',8)}}
/* ---------- entrada ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function pickUp(i){if(S!='up'||!ups[i])return;ups[i][2]();nextRound()}
cv.addEventListener('pointerdown',e=>{const[x,y]=pos(e);
 if(S=='menu'){ORDER.forEach((k,i)=>{if(x>=8+i*98&&x<=98+i*98&&y>=52&&y<=202)start(k)})}
 else if(S=='up'){ups.forEach((u,i)=>{const bx=10+i*130;if(x>=bx&&x<=bx+120&&y>=72&&y<=162)pickUp(i)})}
 else if(S=='dead')S='menu';
 else if(S=='buff')buffTap(x,y);else if(S=='pause')S='play';else if(btnTap(x,y));
 else{J={id:e.pointerId,ox:x,oy:y,kx:x,ky:y,x:0,y:0};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(!J||J.id!=e.pointerId)return;const[x,y]=pos(e),dx=x-J.ox,dy=y-J.oy,d=Math.hypot(dx,dy);
 J.x=d>6?dx/d:0;J.y=d>6?dy/d:0;const k=Math.min(d,16)/(d||1);J.kx=J.ox+dx*k;J.ky=J.oy+dy*k});
const up=e=>{if(J&&J.id==e.pointerId)J=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if(S=='menu'&&k>='1'&&k<='4')start(ORDER[k-1]);
 else if(S=='up'&&k>='1'&&k<='3')pickUp(k-1);
 else if(S=='dead'&&(k=='enter'||k==' '))S='menu';
 else if(k==' ')special()});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0;J=null});
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(S=='play')upd(dt);else if(S=='dead'||S=='up'){}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const API = '/api';
let USER = null, TOKEN = null;
try {
  TOKEN = localStorage.getItem('auth_token');
  const u = localStorage.getItem('auth_user');
  if (TOKEN && u) USER = JSON.parse(u);
} catch(e){}

async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(API + path, { ...opts, headers });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !opts.noLogout) { logout(); throw new Error('Sesión expirada'); }
  if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
  return data;
}

if (!USER) S = 'login';
let authMode = 'login', authUser = '', authPass = '', authErr = '';

function logout() {
  USER = null; TOKEN = null;
  localStorage.removeItem('auth_token');
  localStorage.removeItem('auth_user');
  S = 'login';
}

async function doAuth() {
  authErr = '';
  if (authUser.length < 3) { authErr = 'Usuario: mínimo 3 caracteres'; renderOverlay(); return; }
  if (authPass.length < 6) { authErr = 'Contraseña: mínimo 6 caracteres'; renderOverlay(); return; }
  try {
    const data = await api('/' + authMode, { method: 'POST', body: JSON.stringify({ username: authUser.trim(), password: authPass }) });
    TOKEN = data.token;
    USER = { username: data.username, best_round: data.best_round || 0 };
    localStorage.setItem('auth_token', TOKEN);
    localStorage.setItem('auth_user', JSON.stringify(USER));
    S = 'menu';
  } catch(e) {
    authErr = e.message;
    renderOverlay();
  }
}

async function submitScore() {
  if (!USER || !TOKEN) return;
  try {
    const r = await api('/score', { method: 'POST', body: JSON.stringify({ round: R, kills, class: cls }), noLogout: true });
    if (r.best_round > (USER.best_round || 0)) {
      USER.best_round = r.best_round;
      localStorage.setItem('auth_user', JSON.stringify(USER));
    }
  } catch(e) {}
}

      <div style="display:flex;margin-bottom:16px">

        <button data-mode="register" style="flex:1;padding:12px;background:#262338;color:${!isLogin?'#fff':'#888'};border:none;border-bottom:2px solid ${!isLogin?'#ffd24a':'#333'};font-family:inherit;font-size:10px;cursor:pointer">REGISTRARSE</button>
      </div>
      <input id="in-user" placeholder="usuario" maxlength="20" autocomplete="username" value="${authUser.replace(/"/g,'&quot;')}"
        style="width:100%;padding:14px;margin-bottom:10px;background:#262338;border:2px solid #444;color:#fff;font-family:inherit;font-size:12px;box-sizing:border-box;border-radius:4px">
      <input id="in-pass" type="password" placeholder="contraseña" maxlength="30" autocomplete="current-password" value="${authPass.replace(/"/g,'&quot;')}"
        style="width:100%;padding:14px;margin-bottom:10px;background:#262338;border:2px solid #444;color:#fff;font-family:inherit;font-size:12px;box-sizing:border-box;border-radius:4px">
      <div style="color:#f55;font-size:9px;min-height:18px;margin-bottom:10px;line-height:1.4">${authErr||''}</div>
      <button id="btn-auth" style="width:100%;padding:16px;background:${isLogin?'#2d4a2f':'#4a3a2d'};color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;border-radius:4px">${isLogin?'ENTRAR':'CREAR CUENTA'}</button>
      <button id="btn-guest" style="width:100%;padding:12px;background:transparent;color:#666;border:none;font-family:inherit;font-size:9px;cursor:pointer;margin-top:14px">Jugar sin cuenta</button>
    `;
    overlayInner.querySelectorAll('button[data-mode]').forEach(b => {
      b.onclick = () => { authMode = b.dataset.mode; authErr = ''; renderOverlay(); };
    });
    const iu = document.getElementById('in-user');
    const ip = document.getElementById('in-pass');
    iu.oninput = e => authUser = e.target.value;
    ip.oninput = e => authPass = e.target.value;
    ip.onkeydown = e => { if (e.key === 'Enter') doAuth(); };
    document.getElementById('btn-auth').onclick = doAuth;
    document.getElementById('btn-guest').onclick = () => { S = 'menu'; };
  } else if (S === 'leaderboard') {
    const rows = lbCache.length
      ? lbCache.map((r, i) => {
          const col = i === 0 ? '#ffd24a' : i === 1 ? '#ccc' : i === 2 ? '#c96' : '#ddd';
          const safe = String(r.username).replace(/[<>&]/g, '');
          return `<div style="display:flex;justify-content:space-between;padding:8px 12px;background:${i%2?'#1c1a24':'#262338'};margin-bottom:2px;border-radius:3px">
            <span style="color:${col};font-size:10px">${i+1}. ${safe}</span>
            <span style="color:${col};font-size:10px">R${r.best_round}</span>
          </div>`;
        }).join('')
      : '<p style="text-align:center;color:#888;font-size:10px;padding:24px">Cargando...</p>';
    overlayInner.innerHTML = `
      <h2 style="text-align:center;color:#ffd24a;font-size:14px;margin:16px 0 24px">RANKING GLOBAL</h2>
      <div>${rows}</div>
      <button id="btn-back" style="width:100%;padding:14px;background:#262338;color:#ffd24a;border:none;font-family:inherit;font-size:11px;cursor:pointer;margin-top:20px;border-radius:4px">VOLVER</button>
    `;
    document.getElementById('btn-back').onclick = () => { S = 'menu'; };
  }
}

async function loadLeaderboard() {
  overlayInner.innerHTML = '<p style="text-align:center;color:#888;padding:40px;font-size:10px">Cargando ranking...</p>';
  try { lbCache = await api('/leaderboard'); } catch(e) { lbCache = []; }
  renderOverlay();
}

let _lastS = null;
const _drawBase = draw;
draw = function() {
  if (S === 'login' || S === 'register' || S === 'leaderboard') {
    g.fillStyle = '#14121c';
    g.fillRect(0, 0, W, H);
    if (_lastS !== S) {
      overlay.style.display = 'flex';
      if (S === 'leaderboard') loadLeaderboard();
      else renderOverlay();
      _lastS = S;
    }
    return;
  }
  if (_lastS !== S) { overlay.style.display = 'none'; _lastS = S; }
  return _drawBase.apply(this, arguments);
};

const _hurt = hurt;
hurt = function(d) {
  _hurt(d);
  if (S === 'dead') submitScore();
};

T = function(s, x, y, c, a, z) {
  g.font = 'bold ' + (z||8) + 'px "Press Start 2P", monospace';
  g.textAlign = a || 'left';
  g.fillStyle = '#000';
  g.fillText(s, Math.round(x)+1, Math.round(y)+1);
  g.fillStyle = c || '#fff';
  g.fillText(s, Math.round(x), Math.round(y));
};

const _menu = menu;
menu = function() {
  _menu.apply(this, arguments);
  if (USER) {
    T(USER.username, 6, 12, '#ffd24a', 'left', 7);
    T('Mejor: R' + (USER.best_round || 0), 6, 22, '#fff', 'left', 6);
    g.fillStyle = '#262338'; g.fillRect(W - 100, 4, 94, 14);
    g.fillStyle = '#ffd24a'; g.fillRect(W - 100, 4, 94, 2);
    T('RANKING', W - 53, 14, '#ffd24a', 'center', 7);
    g.fillStyle = '#262338'; g.fillRect(W - 100, 20, 94, 12);
    T('CERRAR SESIÓN', W - 53, 29, '#888', 'center', 6);
  }
};

const _draw2 = draw;
draw = function() {
  _draw2.apply(this, arguments);
  if (S === 'play') {
    g.fillStyle = '#14121c';
    g.fillRect(W/2 + 30, 0, 40, 18);
    g.fillStyle = '#14121c';
    g.fillRect(W - 130, H - 46, 128, 40);
    const pxx = W - 22, pyy = 34;
    g.fillStyle = 'rgba(0,0,0,.7)';
    g.beginPath(); g.arc(pxx, pyy, 16, 0, 6.283); g.fill();
    g.strokeStyle = '#ffd24a'; g.lineWidth = 2;
    g.beginPath(); g.arc(pxx, pyy, 16, 0, 6.283); g.stroke();
    g.lineWidth = 1;
    g.fillStyle = '#ffd24a';
    g.fillRect(pxx - 5, pyy - 7, 3, 14);
    g.fillRect(pxx + 2, pyy - 7, 3, 14);
    const bx = W - 30, by = H - 30;
    const pos2 = [[bx - 38, by - 38], [bx, by - 38], [bx - 38, by], [bx, by]];
    CLS[cls].ab.forEach((a, i) => {
      const [x, y] = pos2[i];
      const lk = P.lv < SKL[i];
      const cd = clamp(P.cds[i] / a.cd, 0, 1);
      g.fillStyle = lk ? '#111' : 'rgba(38,35,56,.9)';
      g.beginPath(); g.arc(x, y, 18, 0, 6.283); g.fill();
      if (!lk && cd > 0) {
        g.fillStyle = 'rgba(0,0,0,.65)';
        g.beginPath(); g.moveTo(x, y);
        g.arc(x, y, 18, -1.57, -1.57 + 6.283 * cd); g.fill();
      }
      g.strokeStyle = lk ? '#555' : P.mp < a.mp ? '#38f' : CLS[cls].c;
      g.lineWidth = 2;
      g.beginPath(); g.arc(x, y, 18, 0, 6.283); g.stroke();
      g.lineWidth = 1;
      T(lk ? 'Nv' + SKL[i] : String(i + 1), x, y + 3, lk ? '#666' : '#fff', 'center', 9);
      T(a.n.slice(0, 6), x, y + 28, lk ? '#555' : '#ccc', 'center', 5);
    });
  }
  if (S === 'pause') {
    g.fillStyle = '#262338';
    g.fillRect(W - 100, 14, 94, 18);
    g.fillStyle = '#ffd24a';
    g.fillRect(W - 100, 14, 94, 2);
    T('VOLVER AL MENÚ', W - 53, 27, '#ffd24a', 'center', 7);
  }
};

btnTap = function(x, y) {
  if (Math.hypot(x - (W - 22), y - 34) < 20) { togglePause(); return 1; }
  const bx = W - 30, by = H - 30;
  const pos2 = [[bx - 38, by - 38], [bx, by - 38], [bx - 38, by], [bx, by]];
  for (let i = 0; i < 4; i++) {
    if (Math.hypot(x - pos2[i][0], y - pos2[i][1]) < 20) { cast(i); return 1; }
  }
  return 0;
};

document.addEventListener('pointerdown', e => {
  if (S === 'menu' && USER) {
    const [x, y] = pos(e);
    if (x >= W-100 && x <= W-6 && y >= 4 && y <= 18) { S = 'leaderboard'; e.stopPropagation(); e.preventDefault(); return; }
    if (x >= W-100 && x <= W-6 && y >= 20 && y <= 32) { logout(); e.stopPropagation(); e.preventDefault(); return; }
  }
  if (S === 'pause') {
    const [x, y] = pos(e);
    if (x >= W-100 && x <= W-6 && y >= 14 && y <= 32) {
      S = 'menu'; J = null; e.stopPropagation(); e.preventDefault();
    }
  }
}, { capture: true });

addEventListener('keydown', e => {
  if ((S === 'login' || S === 'register') && e.key === 'Enter') doAuth();
  if (S === 'leaderboard' && (e.key === 'Escape' || e.key === 'Enter')) S = 'menu';
}, { capture: true });

/* ============================================================
   v7: Animaciones procedurales (sprites temporales)
   ============================================================ */
function mkFrame(w, h, drawFn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  drawFn((a, b, cw, ch, col) => { x.fillStyle = col; x.fillRect(a, b, cw, ch); });
  const d = x.getImageData(0, 0, w, h), o = x.createImageData(w, h);
  const A = (i, j) => i >= 0 && j >= 0 && i < w && j < h ? d.data[(j*w+i)*4+3] : 0;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = (j*w+i)*4;
    if (A(i, j)) o.data.set(d.data.subarray(k, k+4), k);
    else if (A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1)) o.data.set([20,16,28,255], k);
  }
  x.putImageData(o, 0, 0);
  return c;
}

const CFG = {
  guerrero:  { body: '#4a6fa5', leg: '#3a3a4a', hair: '#aab',    deco: 'helmet' },
  hechicero: { body: '#6a3fa0', leg: '#6a3fa0', hair: '#4b2a7a', deco: 'hat' },
  asesino:   { body: '#2b2b38', leg: '#222',    hair: '#1c1c26', deco: 'hood' },
  barbaro:   { body: '#f1c27d', leg: '#7a4a1e', hair: '#a0521d', deco: 'hair' }
};

function decorate(p, deco, dir) {
  const isUp = dir === 'up';
  const isSide = dir === 'side';
  if (deco === 'helmet') {
    p(4, 1, 6, 2, '#aab');
    if (!isUp) p(6, 0, 2, 1, '#d33');
    if (!isUp) {
      p(11, 3, 1, 7, '#dde');
      if (!isSide) p(10, 10, 3, 1, '#8a5a2b');
    }
  } else if (deco === 'hat') {
    p(3, 1, 8, 2, '#4b2a7a');
    p(5, 0, 4, 1, '#4b2a7a');
    if (!isUp) { p(10, 2, 3, 2, '#5ef'); p(11, 3, 1, 10, '#7a4a1e'); }
  } else if (deco === 'hood') {
    p(4, 1, 6, 3, '#1c1c26');
    if (!isUp) { p(4, 4, 6, 1, '#1c1c26'); p(4, 10, 6, 1, '#a33'); p(11, 8, 1, 3, '#cde'); }
  } else if (deco === 'hair') {
    p(3, 1, 8, 3, '#a0521d');
    if (!isUp) {
      p(4, 6, 6, 2, '#a0521d');
      p(4, 10, 6, 1, '#5a3a1a');
      p(11, 5, 1, 7, '#7a4a1e');
      if (!isSide) p(10, 3, 3, 3, '#bcc');
    }
  }
}

function drawChar(p, cfg, dir, frame) {
  const legs = [[3,3],[2,3],[3,2]][frame] || [3,3];
  const bob = frame === 1 ? -1 : 0;
  const isUp = dir === 'up';
  const isSide = dir === 'side';
  if (isSide) {
    p(4, 12, 2, legs[0], cfg.leg);
    p(7, 12, 2, legs[1], cfg.leg);
    p(4, 7+bob, 6, 5, cfg.body);
    p(9, 7+bob, 1, 4, '#f1c27d');
    p(4, 2+bob, 6, 5, '#f1c27d');
    p(8, 4+bob, 1, 1, '#222');
    p(10, 4+bob, 1, 1, '#f1c27d');
    decorate(p, cfg.deco, dir);
  } else {
    p(4, 12, 2, legs[0], cfg.leg);
    p(8, 12, 2, legs[1], cfg.leg);
    p(4, 7+bob, 6, 5, cfg.body);
    if (!isUp) { p(3, 7+bob, 1, 4, '#f1c27d'); p(10, 7+bob, 1, 4, '#f1c27d'); }
    else { p(3, 7+bob, 1, 4, cfg.body); p(10, 7+bob, 1, 4, cfg.body); }
    p(4, 2+bob, 6, 5, isUp ? cfg.hair : '#f1c27d');
    if (!isUp) { p(5, 4+bob, 1, 1, '#222'); p(8, 4+bob, 1, 1, '#222'); }
    decorate(p, cfg.deco, dir);
  }
}

const ANIM = {};
for (const k of ORDER) {
  const cfg = CFG[k];
  ANIM[k] = {
    down: [0,1,2].map(f => mkFrame(14, 16, p => drawChar(p, cfg, 'down', f))),
    up:   [0,1,2].map(f => mkFrame(14, 16, p => drawChar(p, cfg, 'up', f))),
    side: [0,1,2].map(f => mkFrame(14, 16, p => drawChar(p, cfg, 'side', f)))
  };
}

let animT = 0;
let P_dir = 'down';

const _upd = upd;
upd = function(dt) {
  animT += dt;
  if (P && P.attacking > 0) P.attacking -= dt;
  return _upd.apply(this, arguments);
};

const _attack = attack;
attack = function() {
  const r = _attack.apply(this, arguments);
  if (r) P.attacking = 0.2;
  return r;
};

drawP = function() {
  if (P.inv > 0 && ((time * 20) | 0) % 2) return;
  shadow(P.x, P.y, 10);
  const moving = Math.hypot(P.dx || 0, P.dy || 0) > 0.1;
  if (moving) {
    if (Math.abs(P.dx || 0) > Math.abs(P.dy || 0)) {
      P_dir = (P.dx || 0) < 0 ? 'left' : 'right';
    } else {
      P_dir = (P.dy || 0) < 0 ? 'up' : 'down';
    }
  }
  const anim = ANIM[cls] || ANIM.guerrero;
  let frames, flip = false;
  if (P_dir === 'up') frames = anim.up;
  else if (P_dir === 'left') { frames = anim.side; flip = true; }
  else if (P_dir === 'right') frames = anim.side;
  else frames = anim.down;
  let fi = 0;
  if (moving) fi = 1 + (Math.floor(animT * 8) % 2);
  const frame = frames[fi] || frames[0];
  spr(frame, P.x, P.y, flip);
  if (P.shield > 0 || P.rage > 0) {
    g.strokeStyle = P.shield > 0 ? '#7cf' : '#f64';
    g.beginPath(); g.arc(P.x - cx, P.y - cy, 12, 0, 6.283); g.stroke();
  }
};
