services:
  web:
    build: .
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    expose:
      - "3000"
    volumes:
      - api-data:/data
    environment:
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
    restart: unless-stopped

volumes:
  api-data:
